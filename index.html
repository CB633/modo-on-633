<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="description" content="MODO ON 633: organizá tus materias, notas y actividades. Activá tus metas. Subí de nivel.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MODO ON 633</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><noscript><p style="padding:20px">Activá JavaScript para usar MODO ON 633.</p></noscript></div>

<!-- Hoja modal (formularios y confirmaciones) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" onclick="App.close()"></div>
  <div class="sheet-box" id="sheetBox" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" onchange="App.importFile(this)">
<input type="file" id="logoFile" accept="image/*" onchange="App.setLogo(this)">

<!-- Área que se usa solo al imprimir el resumen trimestral -->
<div id="printArea"></div>

<script src="app.js"></script>
</body>
</html>
